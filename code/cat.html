<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐱 一只猫</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #ffd9a0 0%, #ffb26b 55%, #ff8c42 100%);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }

  .ground {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 22vh;
    background: linear-gradient(180deg, #7ec850 0%, #4e9f3d 100%);
    border-radius: 50% 50% 0 0 / 30% 30% 0 0;
  }

  .cat-wrap {
    position: relative;
    z-index: 2;
    animation: breathe 4s ease-in-out infinite;
    transform-origin: 50% 100%;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1, 1); }
    50%      { transform: scale(1.015, 0.985); }
  }

  /* 尾巴摇动 */
  .tail { animation: tailWag 3s ease-in-out infinite; transform-origin: 30px 40px; }
  @keyframes tailWag {
    0%, 100% { transform: rotate(-8deg); }
    50%      { transform: rotate(14deg); }
  }

  /* 眨眼 */
  .eye-l, .eye-r { animation: blink 4s infinite; }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(0.08); }
  }

  /* 前爪小动作 */
  .paw-l { animation: pawTap 2.4s ease-in-out infinite; transform-origin: 50% 20%; }
  @keyframes pawTap {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(2.5px); }
  }

  .title {
    position: relative;
    z-index: 3;
    margin-top: 24px;
    font-size: 20px;
    font-weight: 600;
    color: #7a4a1f;
    letter-spacing: 2px;
    text-shadow: 0 1px 0 rgba(255,255,255,.4);
  }
</style>
</head>
<body>

  <div class="cat-wrap">
    <svg width="420" height="460" viewBox="0 0 420 460" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f6a83b"/>
          <stop offset="100%" stop-color="#e08a24"/>
        </linearGradient>
        <radialGradient id="bellyGrad" cx="0.5" cy="0.35" r="0.8">
          <stop offset="0%" stop-color="#ffe9c4"/>
          <stop offset="100%" stop-color="#f8d49a"/>
        </radialGradient>
      </defs>

      <!-- 尾巴 -->
      <path class="tail" d="M 60 330 Q 10 300 25 250 Q 40 205 60 220 Q 45 250 60 285 Q 70 310 90 320"
            fill="none" stroke="#d97f1e" stroke-width="22" stroke-linecap="round"/>

      <!-- 后腿 -->
      <ellipse cx="130" cy="400" rx="34" ry="26" fill="#d97f1e"/>
      <ellipse cx="290" cy="400" rx="34" ry="26" fill="#d97f1e"/>
      <ellipse cx="118" cy="414" rx="22" ry="12" fill="#f3c887"/>
      <ellipse cx="302" cy="414" rx="22" ry="12" fill="#f3c887"/>

      <!-- 身体 -->
      <ellipse cx="210" cy="330" rx="130" ry="105" fill="url(#bodyGrad)"/>
      <!-- 肚皮 -->
      <ellipse cx="210" cy="365" rx="82" ry="62" fill="url(#bellyGrad)"/>

      <!-- 前腿 -->
      <rect x="150" y="370" width="40" height="70" rx="20" fill="#e8952f"/>
      <rect x="230" y="370" width="40" height="70" rx="20" fill="#e8952f"/>
      <!-- 前爪 -->
      <ellipse class="paw-l" cx="170" cy="442" rx="26" ry="14" fill="#f8d49a"/>
      <ellipse cx="250" cy="442" rx="26" ry="14" fill="#f8d49a"/>
      <line x1="160" y1="444" x2="160" y2="452" stroke="#d9a05f" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="170" y1="446" x2="170" y2="454" stroke="#d9a05f" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="180" y1="444" x2="180" y2="452" stroke="#d9a05f" stroke-width="2.5" stroke-linecap="round"/>

      <!-- 头部 -->
      <ellipse cx="210" cy="170" rx="115" ry="105" fill="url(#bodyGrad)"/>

      <!-- 左耳 -->
      <path d="M 120 120 L 105 35 Q 100 20 118 18 L 190 78 Z" fill="#e8952f"/>
      <path d="M 128 112 L 117 52 Q 115 42 126 42 L 178 84 Z" fill="#f9b8b0"/>
      <!-- 右耳 -->
      <path d="M 300 120 L 315 35 Q 320 20 302 18 L 230 78 Z" fill="#e8952f"/>
      <path d="M 292 112 L 303 52 Q 305 42 294 42 L 242 84 Z" fill="#f9b8b0"/>

      <!-- 虎斑纹 -->
      <path d="M 180 95 Q 210 82 240 95" fill="none" stroke="#d97f1e" stroke-width="10" stroke-linecap="round"/>
      <path d="M 150 120 Q 175 108 195 118" fill="none" stroke="#d97f1e" stroke-width="9" stroke-linecap="round"/>
      <path d="M 270 120 Q 245 108 225 118" fill="none" stroke="#d97f1e" stroke-width="9" stroke-linecap="round"/>

      <!-- 眼睛 -->
      <g class="eye-l">
        <ellipse cx="165" cy="165" rx="22" ry="24" fill="#ffffff"/>
        <ellipse cx="168" cy="167" rx="12" ry="14" fill="#3f8f3f"/>
        <ellipse cx="170" cy="163" rx="5" ry="7" fill="#1d1d1d"/>
        <circle cx="161" cy="157" r="4" fill="#ffffff"/>
      </g>
      <g class="eye-r">
        <ellipse cx="255" cy="165" rx="22" ry="24" fill="#ffffff"/>
        <ellipse cx="252" cy="167" rx="12" ry="14" fill="#3f8f3f"/>
        <ellipse cx="250" cy="163" rx="5" ry="7" fill="#1d1d1d"/>
        <circle cx="259" cy="157" r="4" fill="#ffffff"/>
      </g>

      <!-- 鼻子 -->
      <path d="M 205 200 L 215 200 L 210 210 Z" fill="#e07070"/>

      <!-- 嘴巴 -->
      <path d="M 210 210 Q 210 222 198 224" fill="none" stroke="#8a5a2a" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 210 210 Q 210 222 222 224" fill="none" stroke="#8a5a2a" stroke-width="3.5" stroke-linecap="round"/>

      <!-- 胡须 -->
      <g stroke="#8a5a2a" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
        <line x1="95"  y1="190" x2="160" y2="205"/>
        <line x1="90"  y1="210" x2="158" y2="215"/>
        <line x1="100" y1="230" x2="162" y2="224"/>
        <line x1="325" y1="190" x2="260" y2="205"/>
        <line x1="330" y1="210" x2="262" y2="215"/>
        <line x1="320" y1="230" x2="258" y2="224"/>
      </g>

      <!-- 腮红 -->
      <ellipse cx="140" cy="225" rx="16" ry="9" fill="#f78f8f" opacity="0.45"/>
      <ellipse cx="280" cy="225" rx="16" ry="9" fill="#f78f8f" opacity="0.45"/>
    </svg>
  </div>

  <div class="title">🐾 喵 ~ 你好呀！</div>
  <div class="ground"></div>

</body>
</html>
